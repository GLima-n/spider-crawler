<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia isolada — aranha 2D</title><style>
*{box-sizing:border-box}body{font:14px/1.5 system-ui,sans-serif;background:#edf1f6;color:#213044;margin:0;padding:28px}h1{font-size:22px;margin:0 0 6px}p{margin:0 0 18px;color:#5e6e80}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:1110px}.stage{border:1px solid #c9d4df;border-radius:15px;overflow:hidden;background:white}.stage.dark{background:#0a1322;border-color:#263d53;color:#dcefff}h2{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:12px 18px 0;margin:0}.stage canvas{display:block;width:100%;height:auto}.note{font-size:12px;padding:0 18px 16px;opacity:.7}.controls{margin-top:18px;display:flex;gap:10px;align-items:center}button{padding:9px 14px;border:1px solid #668bb0;border-radius:7px;background:#fff;color:#20344d;cursor:pointer}button:focus-visible{outline:2px solid #317df0}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><h1>Prévia isolada do personagem</h1><p>Canvas 2D + articulações calculadas com o IK do projeto. O motor da extensão permanece intacto.</p><div class="grid"><section class="stage"><h2>Fundo claro · corpo escuro</h2><canvas id="light" width="520" height="380"></canvas><div class="note">Oito patas, cabeça integrada, dois olhos.</div></section><section class="stage dark"><h2>Fundo escuro · corpo claro</h2><canvas id="dark" width="520" height="380"></canvas><div class="note">A mesma pose articulável em contraste adaptado.</div></section></div><div class="controls"><button id="toggle">Pausar movimento</button><span id="status">Animando</span></div><script type="module" src="/preview/isolated.ts"></script></body></html>
